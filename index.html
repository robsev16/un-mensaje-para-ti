<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>Un mensaje para ti</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101828, #243b53);
  color: #fff;
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.card {
  max-width: 560px;
  width: 100%;
  background: #fff;
  color: #172033;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,.4);
}

h1 {
  font-size: clamp(27px, 7vw, 32px);
  margin: 12px 0;
}

h2 {
  font-size: clamp(23px, 6vw, 27px);
}

p {
  font-size: 17px;
  line-height: 1.6;
}

.tag,
.small {
  font-size: 12px;
  color: #64748b;
}

.verse {
  border-left: 4px solid #2563eb;
  padding-left: 14px;
  font-style: italic;
}

button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #2563eb;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  touch-action: manipulation;
}

.alt {
  background: #e2e8f0;
  color: #172033;
}

.progress {
  height: 6px;
  background: #e2e8f0;
  border-radius: 8px;
  overflow: hidden;
  margin: 20px 0;
}

.bar {
  height: 100%;
  background: #2563eb;
  width: 10%;
  transition: width .2s;
}
</style>
</head>

<body>

<main class="card">

<div class="tag">
Historia interactiva · Iglesia Bethel Asambleas de Dios
</div>

<section id="screen">
<h1>Un mensaje para ti</h1>

<p>
Imagina que estás teniendo un día difícil.
Tienes preguntas, presión y cosas que nadie parece entender.
</p>

<p>
Encuentras un mensaje que te invita a detenerte.
</p>

<button data-next="1">
Leer el mensaje
</button>
</section>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p class="small">
Tus respuestas cambian el recorrido.
No hay respuestas perfectas.
</p>

</main>

<script>
(function() {
'use strict';

const s = {

1: [
"¿Cómo reaccionas?",
"Cuando la vida se vuelve difícil, ¿qué sueles hacer?",
[
["Me encierro y lo soporto solo", 2],
["Busco a alguien que me escuche", 3],
["Me distraigo para no pensar", 4]
]
],

2: [
"Cuando cargas todo solo",
"Quizá sonríes delante de los demás, pero por dentro estás agotado y sientes que nadie sabe lo que estás cargando. Dios sí conoce tu corazón. No tienes que fingir delante de Él: puedes acercarte con tu cansancio, reconocer tu necesidad y encontrar esperanza en Jesucristo.",
[
["Continuar", 5]
]
],

3: [
"Cuando buscas a alguien",
"Contar con personas que nos escuchen es valioso, pero ninguna persona puede ocupar el lugar de Dios. Tus amigos pueden acompañarte, aunque solo Jesucristo puede reconciliarte con el Padre y darte la salvación. Dios te llama a acudir a Él con fe y a caminar junto a una comunidad de creyentes.",
[
["Continuar", 5]
]
],

4: [
"Cuando intentas distraerte",
"Quizá llenas tu día de videos, juegos, música o conversaciones para no quedarte a solas con tus pensamientos. No eres invisible para Dios, y Él no desprecia tus preguntas ni tu dolor. En lugar de esconder lo que llevas dentro, puedes presentárselo a Él y descubrir la esperanza que hay en Cristo.",
[
["Continuar", 5]
]
],

5: [
"Una verdad para todos",
"Todos hemos pecado y estamos separados de la gloria de Dios. El pecado expresa nuestra rebelión y nuestra incapacidad de reconciliarnos con Dios por nuestros propios méritos.",
[
["Descubrir la respuesta de Dios", 6]
]
],

6: [
"La iniciativa de Dios",
"Dios nos ama y tomó la iniciativa para salvarnos. Jesucristo, el Hijo de Dios, vivió sin pecado, murió en la cruz por nuestros pecados y resucitó corporalmente. La salvación es por gracia mediante la fe en Jesucristo, no por obras.",
[
["¿Cómo puedo responder?", 7]
]
],

7: [
"Una respuesta personal",
"La respuesta bíblica es arrepentirse y creer en Jesucristo: reconocer el pecado, apartarse de él y confiar en Jesús como Salvador y Señor. El Espíritu Santo produce el nuevo nacimiento y comienza una obra de transformación.",
[
["Quiero conocer más", 8],
["Quiero pensar y leer la Biblia", 9]
]
],

8: [
"Conocer más de Jesús",
"Si deseas conocer más de Jesús, puedes asistir a una de las iglesias de las Asambleas de Dios cercana. Allí podrás escuchar la Palabra de Dios, hacer preguntas y recibir acompañamiento espiritual. También puedes comenzar leyendo el Evangelio de Juan y orando. Dentro de las iglesias de las Asambleas de Dios enseñamos que el bautismo en el Espíritu Santo es distinto y posterior al nuevo nacimiento, capacita para testificar y servir con poder, y no es requisito para recibir la salvación.",
[
["Leer una promesa", 10]
]
],

9: [
"Tómate un momento",
"No tienes que responder por presión. Puedes leer la Biblia y hablar con alguien maduro en la fe. Considera quién es Jesús, qué hizo en la cruz y qué significa confiar en Él con arrepentimiento y fe.",
[
["Continuar", 11]
]
],

11: [
"Da el siguiente paso",
"Si deseas conocer más de Jesús, puedes asistir a una de las iglesias de las Asambleas de Dios cercana. Allí podrás conocer más de Cristo, escuchar la Palabra de Dios y recibir acompañamiento espiritual. Puedes hacer preguntas, conocer a otros creyentes y crecer en la fe. No tienes que caminar solo: busca una comunidad donde Cristo sea anunciado y la Biblia sea enseñada.",
[
["Leer una promesa", 10]
]
],

10: [
"Una promesa de Jesús",
'<span class="verse">“Vengan a mí todos ustedes que están cansados y agobiados, y yo les daré descanso.” — Mateo 11:28</span><br><br>Jesús te invita a acercarte a Él con sinceridad.',
[
["Volver al inicio", 0]
]
]

};

const screen = document.getElementById('screen');
const bar = document.getElementById('bar');

function show(i) {

if (i === 0) {
window.location.href = window.location.pathname;
return;
}

const x = s[i];

if (!x) return;

screen.innerHTML = '';

const title = document.createElement('h2');
title.textContent = x[0];
screen.appendChild(title);

const text = document.createElement('p');
text.innerHTML = x[1];
screen.appendChild(text);

x[2].forEach(function(item) {

const b = document.createElement('button');

b.type = 'button';
b.textContent = item[0];
b.dataset.next = item[1];

if (item[1] === 0) {
b.className = 'alt';
}

screen.appendChild(b);

});

bar.style.width = (i / 10 * 100) + '%';

}

screen.addEventListener('click', function(e) {

const b = e.target.closest('button[data-next]');

if (b) {
show(Number(b.dataset.next));
}

});

})();
</script>

</body>
</html>
